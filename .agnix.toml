# Generated by agentstd from agent-standards and the [agnix] table of .agentstd.toml.
# Edit those, then run agentstd install; agentstd check fails when this file differs.

tools = ["claude-code", "codex", "opencode"]
exclude = ["node_modules/**", ".git/**", "target/**", "apm_modules/**", ".apm-local/**"]

[rules]
disabled_rules = [
    "VER-001",  # noise: asks to pin tool versions here; agnix defaults are what the standard wants
    "CC-MEM-014",  # duplicate: agentstd [rules] max_lines and max_global_lines warn earlier
    "CC-MEM-015",  # duplicate: agentstd check measures the always-loaded budget per agent
    "CC-MEM-018",  # contradicts ADR-0002: CLAUDE.md does not import AGENTS.md
    "AGM-004",  # contradicts the generated layout: the APM header precedes the overview in AGENTS.md
    "XP-004",  # contradicts nested AGENTS.md: apps in one repository may use different package managers
    "AS-025",  # duplicate: fires only when two skill copies differ, which apm audit already fails
    "OC-SK-002",  # contradicts the skill layout: APM deploys each skill to .claude/skills and .agents/skills
    "CC-SK-027",  # contradicts the command layout: APM writes .apm/prompts to .claude/commands
    "CX-SK-007",  # contradicts the skill release layout: README.md and CHANGELOG.md ship inside a released skill
    "XP-SK-001",  # noise: Claude-only skill fields are ignored elsewhere; AS-020 reports the effect
]

[files]
include_as_memory = ["**/.apm/instructions/**/*.instructions.md"]

# a deployed skill is a copy of .apm/skills or of a package skill, linted where it is written
[[overrides]]
paths = [".claude/skills/**", ".agents/skills/**"]
disabled_rules = ["AS-016", "AS-020", "AS-021", "REF-002"]

# a skill link resolves inside the skill or from the repository root; agentstd check owns links
[[overrides]]
paths = ["**/.apm/skills/**"]
disabled_rules = ["REF-002"]

# rule sources link absolutely under link_base, which agentstd check resolves and agnix cannot read
[[overrides]]
paths = ["**/.apm/instructions/**"]
disabled_rules = ["REF-002"]

# compiled files repeat the sources, where the prompt rules already run
[[overrides]]
paths = ["AGENTS.md", "**/AGENTS.md", ".claude/rules/**"]
disabled_rules = ["PE-002", "PE-004", "PE-005", "PE-006", "CDX-AG-003", "REF-002"]
