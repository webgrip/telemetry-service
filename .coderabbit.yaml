# Generated by agentstd from agent-standards and the [coderabbit] table of .agentstd.toml.
# Edit those, then run agentstd install; agentstd check fails when this file differs.
# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: Be brief and specific. Name the .claude/rules file, skill or docs/ page a finding rests on, or
  say it is general advice. One issue per comment. No praise, no restating the diff.
reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_instructions: 'Write for the person who reviews and tests this change: what behaves differently,
    how to try it, and what could break elsewhere. Leave out file lists.'
  poem: false
  in_progress_fortune: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  enable_prompt_for_ai_agents: true
  slop_detection:
    enabled: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
    - .*
    ignore_title_keywords:
    - WIP
    - '[skip review]'
    labels:
    - '!no-review'
    auto_pause_after_reviewed_commits: 3
  path_filters:
  - '!AGENTS.md'
  - '!**/AGENTS.md'
  - '!CLAUDE.md'
  - '!.claude/rules/**'
  - '!.claude/skills/**'
  - '!.claude/agents/**'
  - '!.agents/skills/**'
  - '!.codex/**'
  - '!.opencode/**'
  - '!apm.lock.yaml'
  - '!**/CHANGELOG.md'
  - '!**/pnpm-lock.yaml'
  - '!**/package-lock.json'
  - '!**/composer.lock'
  - '!**/Cargo.lock'
  - '!**/go.sum'
  - '!**/mise.lock'
  path_instructions:
  - path: .apm/**
    instructions: These are the sources of the agent rules and skills that APM compiles into .claude/rules and AGENTS.md.
      Flag a rule that repeats the shared baseline, a rule without applyTo that only concerns some paths, a relative
      link (links must be absolute under link_base), and anything that looks like a credential.
  - path: .forgejo/workflows/**
    instructions: 'Forgejo Actions, not GitHub Actions. Actions are pinned to a full commit SHA with the version
      in a comment; jobs run on runs-on: docker; step-level continue-on-error must be a literal boolean, because
      Forgejo refuses the whole workflow when it is an expression; an if: on a job that uses a reusable workflow
      does not apply, so gate inside the reusable workflow.'
  - path: '**/*.sops.*'
    instructions: A SOPS file must stay ciphertext. Any plaintext value is a blocking issue.
  pre_merge_checks:
    title:
      mode: warning
      requirements: 'A Conventional Commit header: type(scope)?!?: subject, with type one of feat, fix, perf, refactor,
        docs, test, build, ci, chore, style, revert; subject in English, no trailing period, at most 72 characters.
        Semantic-release reads it after a squash merge.'
    description:
      mode: warning
    docstrings:
      mode: 'off'
    issue_assessment:
      mode: 'off'
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    trivy:
      enabled: true
    checkov:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    skillspector:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    phpstan:
      enabled: false
    phpcs:
      enabled: false
    phpmd:
      enabled: false
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    golangci-lint:
      enabled: false
    clippy:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    htmlhint:
      enabled: false
    dotenvLint:
      enabled: false
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: local
    approval_delay: 7
  issues:
    scope: local
  pull_requests:
    scope: local
chat:
  auto_reply: true
  art: false
